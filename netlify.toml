[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# Needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY set in
# Netlify -> Site configuration -> Environment variables.

# API: same URLs as local dev, served by the names function.
[[redirects]]
  from = "/api/names/:user"
  to = "/.netlify/functions/names?user=:user"
  status = 200

# Single-page app: let React Router handle every other path (including its 404 page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
